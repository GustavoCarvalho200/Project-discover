        <li>

      <footer>
        Feito com ♥ pela <a href="https://rocketseat.com.br" target="_blank" rel="noopener noreferrer">Rocketseat</a>
      </footer>
    </div>

    <!-- Scripts de Ícones e Lógica do Tema -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
